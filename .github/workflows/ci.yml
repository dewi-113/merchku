name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: merchku
          MYSQL_USER: merchku
          MYSQL_PASSWORD: merchku
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install -r requirements.txt
      - run: pip install ruff bandit pytest pytest-cov
      - run: ruff check .
      - run: bandit -r app
      - name: Test SQLite
        run: |
          export FLASK_ENV=dev
          export SQLALCHEMY_DATABASE_URI=sqlite:///test.db
          pytest -q
      - name: Test MySQL
        run: |
          export FLASK_ENV=dev
          export SQLALCHEMY_DATABASE_URI=mysql+pymysql://merchku:merchku@127.0.0.1:3306/merchku
          pytest -q
