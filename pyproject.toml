[tool.ruff]
line-length = 88
target-version = 'py312'

[tool.ruff.lint]
select = ['E','F','I','N','UP','B','A','C4','RET','SIM','RUF']
ignore = ['E501']

[tool.ruff.lint.isort]
known-first-party = ['app']

[tool.bandit]
targets = ['app']
exclude_dirs = ['tests','migrations']

[tool.pytest.ini_options]
addopts = '-q --cov=app --cov-report=term-missing'
testpaths = ['tests']
