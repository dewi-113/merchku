# Render Blueprint: web Flask + PostgreSQL (paket gratis).
# Deploy: Render Dashboard → New → Blueprint → pilih repo ini.
# Saat dibuat, Render meminta nilai DEMO_PASSWORD (password rahasia akun demo).

databases:
  - name: merchku-db
    plan: free
    databaseName: merchku
    user: merchku

services:
  - type: web
    name: merchku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: merchku-db
          property: connectionString
      - key: ENV
        value: prod
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      # Render melayani HTTPS di depan app lewat satu reverse proxy
      - key: SECURE_COOKIES
        value: "1"
      - key: PROXY_FIX_X_FOR
        value: "1"
      # Data demo (toko, produk, pesanan, ulasan) + akun demo berdomain .test
      - key: SEED_DEMO
        value: "1"
      - key: ALLOW_TEST_EMAILS
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
