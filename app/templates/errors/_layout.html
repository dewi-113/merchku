<!doctype html>
<html lang='id'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>{% block title %}{% endblock %} — Merchku</title>
  {# Sengaja tidak extends base.html: halaman error harus tetap tampil walau database bermasalah #}
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: #f6f4ef; color: #14161c; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .box { width: 100%; max-width: 480px; padding: 36px 32px; border: 1px solid #e6e2d8; border-radius: 24px;
           background: #fff; box-shadow: 0 16px 40px -20px rgba(20,22,28,.25); text-align: center; }
    .brand { display: inline-block; margin-bottom: 22px; color: #14161c; font-weight: 800; font-size: 1.1rem;
             letter-spacing: -.02em; text-decoration: none; }
    .code { margin: 0; font-size: 4.5rem; font-weight: 800; line-height: 1; letter-spacing: -.04em;
            background: linear-gradient(135deg, #3b6cf0, #14161c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 12px 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 24px; color: #6b6f7a; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 12px;
           font-weight: 700; text-decoration: none; border: 1px solid #14161c; }
    .btn-dark { background: #14161c; color: #fff; }
    .btn-line { background: #fff; color: #14161c; border-color: #d6d1c4; }
    .btn:hover { opacity: .88; }
  </style>
</head>
<body>
  <main class='box'>
    <a class='brand' href='/'>Merchku</a>
    <p class='code'>{% block code %}{% endblock %}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <div class='actions'>
      <a class='btn btn-dark' href='/'>Ke beranda</a>
      {% block extra_action %}<a class='btn btn-line' href='/katalog/'>Lihat katalog</a>{% endblock %}
    </div>
  </main>
</body>
</html>
