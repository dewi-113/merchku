{% extends 'layouts/base.html' %}
{% block content %}
<div class='container mt-4'>
  <h3>Admin - Dashboard</h3>
  <div class='row g-3'>
    <div class='col-md-4'><div class='card'><div class='card-body'><h5 class='card-title'>Pengguna</h5><p class='display-6'>{{ stats.users }}</p></div></div></div>
    <div class='col-md-4'><div class='card'><div class='card-body'><h5 class='card-title'>Produk</h5><p class='display-6'>{{ stats.products }}</p></div></div></div>
  </div>
  <div class='mt-3'>
    <a class='btn btn-primary' href='{{ url_for("admin.produk_list") }}'>Kelola Produk</a>
    <a class='btn btn-outline-primary' href='{{ url_for("admin.user_list") }}'>Kelola Pengguna</a>
  </div>
</div>
{% endblock %}
